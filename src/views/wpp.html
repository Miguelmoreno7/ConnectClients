<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connect Channels</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f6f7fb;
        color: #111827;
        margin: 0;
        padding: 40px 16px;
      }
      .card {
        max-width: 680px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.1);
        padding: 28px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 12px;
      }
      p {
        margin: 0 0 16px;
        color: #4b5563;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
        margin-bottom: 16px;
      }
      .channel {
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        padding: 12px;
        background: #fff;
      }
      .channel h2 {
        margin: 0 0 10px;
        font-size: 16px;
      }
      button {
        background: #16a34a;
        color: #ffffff;
        border: none;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
        width: 100%;
      }
      button:disabled {
        background: #9ca3af;
        cursor: not-allowed;
      }
      .badge {
        margin-top: 8px;
        font-size: 12px;
        display: inline-block;
        border-radius: 999px;
        padding: 4px 8px;
        background: #e5e7eb;
      }
      .badge.connected {
        background: #dcfce7;
        color: #166534;
      }
      .badge.error {
        background: #fee2e2;
        color: #991b1b;
      }
      .badge.connecting {
        background: #e0e7ff;
        color: #3730a3;
      }
      #status {
        margin-top: 16px;
        padding: 12px;
        border-radius: 8px;
        background: #f3f4f6;
        color: #111827;
        min-height: 24px;
      }
      .status-success {
        background: #dcfce7;
        color: #166534;
      }
      .status-error {
        background: #fee2e2;
        color: #991b1b;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Step 1: Connect your channels</h1>
      <p>Connect WhatsApp, Instagram Professional, and Facebook Pages.</p>

      <div class="grid">
        <div class="channel">
          <h2>WhatsApp</h2>
          <button id="embedded-signup">Connect WhatsApp</button>
          <div id="status-whatsapp" class="badge">Not connected</div>
        </div>

        <div class="channel">
          <h2>Instagram</h2>
          <button id="instagram-connect">Connect Instagram</button>
          <div id="status-instagram" class="badge">Not connected</div>
        </div>

        <div class="channel">
          <h2>Facebook</h2>
          <button id="facebook-connect">Connect Facebook</button>
          <div id="status-facebook" class="badge">Not connected</div>
        </div>
      </div>

      <div id="status">Waiting to start…</div>
    </div>

    <script>
      window.__APP_CONFIG__ = {
        appId: "__FB_APP_ID__",
        configId: "__FB_CONFIG_ID__",
        graphVersion: "__GRAPH_VERSION__",
        session: "__SESSION__",
        baseUrl: "__BASE_URL__"
      };
    </script>
    <script src="/public/app.js"></script>
    <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>
  </body>
</html>
